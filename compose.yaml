# Host ports come from .env, so this stack runs beside other local projects (ADR 0004).
services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/awez-eh'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8020}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    pgsql:
        # The official PostGIS image is published for amd64 only; Apple silicon runs it emulated.
        image: 'postgis/postgis:18-3.7'
        platform: linux/amd64
        ports:
            - '${FORWARD_DB_PORT:-5452}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            # Replaces the image's PostGIS loader on purpose: see the script.
            - './docker/pgsql/create-testing-database.sh:/docker-entrypoint-initdb.d/10_postgis.sh'
        networks:
            - sail
        # Over TCP: while the first start runs the init scripts, PostgreSQL listens on its socket only,
        # so a socket check would report it ready too early. `sail up -d --wait` waits for this.
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-h'
                - '127.0.0.1'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            start_period: 120s
            start_interval: 1s
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6399}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
